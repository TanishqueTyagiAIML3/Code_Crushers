<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>

  <!-- Subtle inner circle accent -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="4" stroke-dasharray="12 8"/>

  <!-- Main Education Symbol: Graduation Cap + Open Book + Radiating Knowledge -->
  <g filter="url(#dropShadow)">
    <!-- Graduation Cap Rhombus -->
    <polygon points="256,110 390,175 256,240 122,175" fill="#ffffff"/>
    <polygon points="256,110 390,175 256,182 122,175" fill="#f8fafc"/>

    <!-- Skullcap Base -->
    <path d="M175,202 L175,260 C175,295 210,315 256,315 C302,315 337,295 337,260 L337,202 L256,242 Z" fill="#ffffff" fill-opacity="0.95"/>

    <!-- Cap Tassel & Cord -->
    <path d="M370,185 C375,210 382,235 385,265" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round"/>
    <circle cx="386" cy="275" r="9" fill="url(#goldGrad)"/>
    <path d="M380,282 L392,282 L389,315 L383,315 Z" fill="url(#goldGrad)"/>

    <!-- Open Book Below -->
    <path d="M140,345 C180,335 225,340 256,360 C287,340 332,335 372,345 C372,385 365,405 360,410 C320,400 280,405 256,420 C232,405 192,400 152,410 C147,405 140,385 140,345 Z" fill="#ffffff"/>
    <!-- Book Center Divider -->
    <line x1="256" y1="360" x2="256" y2="420" stroke="#ea580c" stroke-width="3" stroke-linecap="round"/>

    <!-- Speech / Voice AI Soundwaves (Empowering voice-first Indian dialects) -->
    <path d="M80,256 C70,225 70,185 85,155" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round"/>
    <path d="M55,275 C40,230 40,170 60,135" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" stroke-opacity="0.7"/>

    <path d="M432,256 C442,225 442,185 427,155" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round"/>
    <path d="M457,275 C472,230 472,170 452,135" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" stroke-opacity="0.7"/>
  </g>
</svg>
